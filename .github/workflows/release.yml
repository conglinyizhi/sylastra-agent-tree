name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.1.1). Defaults to package.json version'
        required: false
        type: string
      bet-version:
        description: 'better-edit-tools-mcp version tag (e.g. v0.4.0). Defaults to latest'
        required: false
        type: string
        default: latest

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BET_REPO: conglinyizhi/better-edit-tools-mcp
      BET_VERSION: ${{ inputs.bet-version || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: updater/go.mod

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine version
        id: version
        run: |
          PKG_VER="v$(jq -r '.version' package.json)"
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${PKG_VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifact bundles
        run: bun run build:release

      - name: Verify packaged release artifact
        run: bun run scripts/verify-release-artifact.ts

      - name: Verify OpenCode host smoke test
        run: bun run verify:host-smoke

      - name: Collect release files
        id: files
        run: |
          mapfile -t archives < <(find release-bundles -maxdepth 1 -type f -name 'sylastra-agent-tree-*.tar.gz' | sort)
          {
            echo 'archives<<EOF'
            printf '%s\n' "${archives[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## sylastra-agent-tree ${{ steps.version.outputs.tag }}

            OpenCode 的 Agent 编排插件。

            ### 内含
            - 自包含的 release artifact
            - `sylastra-updater` 自动更新二进制（linux/darwin amd64+arm64）
            - `better-edit-tools` 文件编辑工具（linux/darwin amd64+arm64）

            ### 平台
            - 已发布：linux-amd64、linux-arm64、darwin-amd64、darwin-arm64
            - 预留未启用：windows-amd64、windows-arm64

            ### 安装
            下载与你系统匹配的压缩包，解压后执行：

            ```bash
            ./install.sh
            ```
          files: |
            ${{ steps.files.outputs.archives }}
            release-bundles/manifest.json
            release-bundles/SHA256SUMS
          draft: false
          prerelease: false
